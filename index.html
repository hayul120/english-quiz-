<!DOCTYPE html>
<html lang="ko"> 
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Word Master</title>

<style>

*{
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    margin:0;
    background:#f5f5f5;
    color:#222;
}

.container{
    max-width:500px;
    margin:auto;
    padding:20px;
}

.card{
    background:white;
    border-radius:20px;
    padding:20px;
    margin-bottom:15px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

h1{
    text-align:center;
    margin-bottom:5px;
}

.subtitle{
    text-align:center;
    color:#666;
}

.stats{
    display:flex;
    justify-content:space-around;
    text-align:center;
}

.stat{
    font-size:14px;
}

.number{
    font-size:25px;
    font-weight:bold;
}

button{

    width:100%;
    padding:15px;
    margin-top:10px;

    border:none;
    border-radius:15px;

    background:#333;
    color:white;

    font-size:16px;

}

button:active{
    transform:scale(0.98);
}


.quote{

    text-align:center;
    font-style:italic;
    color:#555;

}


.hidden{
    display:none;
}


input{

    width:100%;
    padding:15px;

    border-radius:12px;
    border:1px solid #ccc;

    font-size:16px;

}


.dark{

    background:#121212;
    color:white;

}


.dark .card{

    background:#1e1e1e;

}


.dark .quote{

    color:#ddd;

}

#app{
    display:none;
}

</style>

</head>


<body>


<div class="container" id="app">


<div class="card">

<h1>Word Master</h1>

<div class="subtitle">
Remember More, Forget Less.
</div>

</div>



<div class="card">

<div class="stats">


<div class="stat">

오늘 목표

<div class="number">
30
</div>

문제

</div>



<div class="stat">

정답률

<div class="number" id="accuracy">
0%
</div>

</div>



<div class="stat">

전체 단어

<div class="number" id="wordCount">
0
</div>

</div>


</div>

</div>





<div class="card">


<button onclick="startQuiz()">
퀴즈 시작
</button>


<button onclick="addWord()">
단어 추가
</button>

<button onclick="showWrongNotes()">
오답노트
</button>

    
<button onclick="wrongQuiz()">
오답 시험
</button>
    
<button onclick="toggleDark()">
다크 모드
</button>



</div>


<div class="card">

<h3>📚 단어 관리</h3>

<button onclick="toggleWordList()">
단어 목록 보기
</button>

<div id="wordList" class="hidden">
</div>

</div>


<div class="card quote">

오늘의 한마디

<br><br>

"5문제만 풀어도 괜찮아요."

</div>

<div class="card hidden" id="wrongBox">

<h3>📒 오답노트</h3>

<div id="wrongList"></div>

</div>


</div>

<script>

let words = JSON.parse(localStorage.getItem("words")) || [];

let password = localStorage.getItem("password");

let wrongNotes = JSON.parse(localStorage.getItem("wrongNotes")) || [];

function addWord(){

    let word = prompt("외울 영단어를 입력하세요.");

    if(word === null || word.trim() === ""){
        return;
    }


    let meaning = prompt("뜻을 입력하세요.");

    if(meaning === null || meaning.trim() === ""){
        return;
    }


    words.push({

        word: word,
        meaning: meaning,
        correct:0,
        wrong:0

    });


    saveWords();

updateStats();

showWords();

alert("단어가 추가되었습니다!");

}



function saveWords(){

    localStorage.setItem(
        "words",
        JSON.stringify(words)
    );

}



function updateStats(){

    document.getElementById("wordCount").innerText =
    words.length;


    let total = 0;
    let correct = 0;


    words.forEach(function(w){

        total += w.correct + w.wrong;

        correct += w.correct;

    });


    let rate = 0;


    if(total > 0){

        rate = Math.round(
            correct / total * 100
        );

    }


    document.getElementById("accuracy").innerText =
    rate + "%";


}
function showWords(){

    let list =
    document.getElementById("wordList");


    if(words.length === 0){

        list.innerHTML = "단어가 없습니다.";

        return;

    }


    list.innerHTML = "";


    words.forEach(function(w,index){

        list.innerHTML +=
`
<div>
<hr>

<b>${w.word}</b>
<br>
${w.meaning}

<br>

<button onclick="editWord(${index})">
수정
</button>

<button onclick="deleteWord(${index})">
삭제
</button>

</div>
`;

    });

}
function toggleWordList(){

    let list =
    document.getElementById("wordList");


    list.classList.toggle("hidden");


}
function deleteWord(index){

    let check =
    confirm(
        words[index].word + "를 삭제할까요?"
    );


    if(check){

        words.splice(index,1);


        saveWords();

        updateStats();

        showWords();

        alert("삭제되었습니다.");

    }

}
function editWord(index){

    let newWord = prompt(
        "새 단어를 입력하세요.",
        words[index].word
    );


    if(newWord === null || newWord.trim() === ""){
        return;
    }


    let newMeaning = prompt(
        "새 뜻을 입력하세요.",
        words[index].meaning
    );


    if(newMeaning === null || newMeaning.trim() === ""){
        return;
    }


    words[index].word = newWord;

    words[index].meaning = newMeaning;


    saveWords();

    showWords();

    alert("수정되었습니다!");

}

function startQuiz(){

    if(words.length === 0){

        alert("먼저 단어를 추가하세요!");

        return;

    }


    let random =
    words[Math.floor(Math.random()*words.length)];


    let answer =
prompt(random.meaning + "의 영어 단어는?");


    if(answer === null){
        return;
    }


  if(answer.trim() === (random.word || "").trim()){

    random.correct++;

    alert("정답입니다! 🎉");

}

else{

    random.wrong++;


    wrongNotes.push({

        word: random.word,

        meaning: random.meaning,

        wrongAnswer: answer

    });


    localStorage.setItem(
        "wrongNotes",
        JSON.stringify(wrongNotes)
    );


    alert(
        "틀렸습니다.\n\n정답: " 
+ random.word
    );

}


    saveWords();

    updateStats();

}




function toggleDark(){

    document.body.classList.toggle("dark");

}

function showWrongNotes(){

    let box = document.getElementById("wrongBox");

    let list = document.getElementById("wrongList");


    if(wrongNotes.length === 0){

        list.innerHTML = "아직 오답이 없습니다.";

    }


    else{

        list.innerHTML = "";


        wrongNotes.forEach(function(w){

            list.innerHTML +=
`
<div>
<hr>
<b>${w.word}</b><br>
내 답: ${w.wrongAnswer}<br><br>

<button onclick="showAnswer('${w.word}')">
정답 보기
</button>
<br>

<button type="button" onclick="retryWrong('${w.word}')">
다시 풀기
</button>

</div>
`;

        });

    }


    box.classList.remove("hidden");

}
function showAnswer(word){

    let target = wrongNotes.find(
        function(w){
            return w.word === word;
        }
    );

    alert(
        "정답: " + target.meaning
    );

}
function retryWrong(word){

    let targetIndex = wrongNotes.findIndex(
        function(w){
            return w.word === word;
        }
    );


    let target = wrongNotes[targetIndex];


    let answer = prompt(
    target.meaning + "의 영어 단어는?"
);


    if(answer.trim() === target.meaning.trim()){
        alert("정답입니다! 🎉");


        wrongNotes.splice(targetIndex,1);


        localStorage.setItem(
            "wrongNotes",
            JSON.stringify(wrongNotes)
        );


        showWrongNotes();

    }

    else{

        alert(
            "틀렸습니다.\n정답: "
            + target.meaning
        );

    }

}

function wrongQuiz(){

    if(wrongNotes.length === 0){

        alert("오답이 없습니다.");

        return;

    }


    let random =
    wrongNotes[
        Math.floor(Math.random()*wrongNotes.length)
    ];


    let answer =
prompt(random.meaning + "의 영어 단어는?");


    if(answer === null){

        return;

    }


    if(answer.trim() === random.word.trim()){

        alert("정답입니다! 🎉");

    }

    else{

        alert(
            "틀렸습니다.\n정답: "
            + random.word
        );

    }

}
updateStats();

showWords();

function checkPassword(){

    let saved =
    localStorage.getItem("password");


    let input =
    document.getElementById("passwordInput").value;


    if(input.length !== 4){

        alert("4자리 숫자를 입력하세요.");
        return;

    }


    if(saved === null){

        localStorage.setItem(
            "password",
            input
        );

        alert("비밀번호가 설정되었습니다!");

        showApp();

    }


    else if(input === saved){

        alert("로그인 성공!");

        showApp();

    }


    else{

        alert("비밀번호가 틀렸습니다.");

    }

}


</script>

<div class="card" id="loginBox">

<h3>로그인</h3>

<input 
id="passwordInput"
type="password"
maxlength="4"
placeholder="4자리 숫자 비밀번호">


<button onclick="login()">
시작하기
</button>


</div>



<script>

function login(){

    let input =
    document.getElementById("passwordInput").value;


    if(input.length !== 4){

        alert("4자리 숫자를 입력하세요.");

        return;

    }


    let savedPassword =
    localStorage.getItem("password");


    if(savedPassword === null){

        localStorage.setItem(
            "password",
            input
        );

        alert("비밀번호가 저장되었습니다.");

    }


    else if(input !== savedPassword){

        alert("비밀번호가 틀렸습니다.");

        return;

    }


    alert("Word Master 시작!");


    document.getElementById("app").style.display="block";


    document.getElementById("loginBox").style.display="none";


    showWords();

}


</script>


</body>

</html>
